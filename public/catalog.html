<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кинокаталог — каталог фильмов</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🎬 Кинокаталог</a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="catalog.html" class="nav-link active">Каталог</a>
        <a href="item.html" class="nav-link">Карточка фильма</a>
        <a href="add.html" class="nav-link">Добавить фильм</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Каталог фильмов</h1>

    <!-- Блок фильтров (Лабораторная 2) -->
    <section class="filters" aria-label="Поиск и фильтры">
      <input type="text" id="search-input" placeholder="Поиск по названию...">
      <select id="category-filter">
        <option value="all">Все категории</option>
      </select>
    </section>

    <!-- Сетка каталога, которая заполняется через JS -->
    <section class="catalog-grid" id="catalog-grid"></section>
    
    <!-- Сообщение, если ничего не найдено -->
    <p id="no-results" style="display: none; text-align: center; font-size: 1.2rem; margin-top: 20px; color: #94a3b8;">
      Ничего не найдено
    </p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 Кинокаталог. Учебный проект по HTML и CSS.</p>
    </div>
  </footer>

  <!-- Подключение скриптов (Лабораторная 2) -->
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
